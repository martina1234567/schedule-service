<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - Employee Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body>
<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
    <div class="loading-content">
        <div class="spinner"></div>
        <p>Loading your schedule...</p>
    </div>
</div>

<!-- MAIN CONTAINER -->
<div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="images/shopping.png" alt="Company Logo" class="logo-img">
                <span class="logo-text">My Schedule</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <!-- WEEKLY HOURS SECTION -->
            <div class="nav-section">
                <h3 class="nav-section-title">📊 Weekly Hours</h3>
                <div class="weekly-hours-widget">
                    <div class="hours-display">
                        <div class="current-week">
                            <span class="week-label">This Week:</span>
                            <span class="hours-value" id="currentWeekHours">0h</span>
                        </div>
                        <div class="hours-breakdown" id="hoursBreakdown">
                            <div class="breakdown-item">
                                <span>Scheduled:</span>
                                <span id="scheduledHours">0h</span>
                            </div>
                            <div class="breakdown-item">
                                <span>Worked:</span>
                                <span id="workedHours">0h</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- USER INFO SECTION -->
            <div class="nav-section">
                <div class="user-info">
                    <div class="user-avatar">
                        <span id="userInitials">--</span>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="userName">Loading...</span>
                        <span class="user-role">Employee</span>
                    </div>
                </div>
            </div>

            <!-- LOGOUT BUTTON -->
            <div class="nav-section">
                <button class="logout-btn" id="logoutBtn">
                    <span class="logout-icon">🚪</span>
                    <span>Logout</span>
                </button>
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- HEADER -->
        <header class="main-header">
            <div class="header-content">
                <h1 class="page-title">My Work Schedule</h1>
                <div class="header-info">
                    <span class="current-date" id="currentDate">Loading...</span>
                </div>
            </div>
        </header>

        <!-- CALENDAR SECTION -->
        <section class="calendar-section">
            <div class="calendar-header">
                <h2>Your Schedule</h2>
                <div class="calendar-legend">
                    <div class="legend-item">
                        <div class="legend-color work"></div>
                        <span>Work Shift</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color leave"></div>
                        <span>Leave/Vacation</span>
                    </div>
                </div>
            </div>

            <div id="calendar" class="calendar-container"></div>
        </section>
    </main>
</div>

<!-- JAVASCRIPT -->
<script src="userDashboardManager.js" defer></script>
</body>
</html>
