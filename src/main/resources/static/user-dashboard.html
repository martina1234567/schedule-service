<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar with Weekly Hours</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.9.0/locales-all.min.js"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="style.css">

    <!-- jsPDF (ако Weekly Hours ще се експортира в PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- Loading Screen (добавен за по-добро потребителско изживяване) -->
<div id="loadingScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44,62,80,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999; color: white; flex-direction: column;">
    <div style="text-align: center;">
        <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
        <h3>Loading Your Schedule...</h3>
        <p>Please wait while we load your personal schedule</p>
    </div>
</div>

<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<!-- Sidebar -->
<div id="sidebar">
    <div class="sidebar-header">
        <img src="images/logo.png" alt="App Logo" id="sidebar-logo">
        <button class="sidebar-toggle" id="sidebarToggle" title="Collapse Sidebar">
            <span class="arrows">&lt;&lt;</span>
        </button>
    </div>

    <!-- ДОБАВЕНИ: User info елементи в sidebar (запазва дизайна) -->
    <div style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div id="userInitials" style="width: 40px; height: 40px; background: linear-gradient(135deg, #3498db, #2980b9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;">U</div>
            <div>
                <div id="userName" style="font-weight: 600; font-size: 14px;">Loading...</div>
                <div style="font-size: 12px; opacity: 0.7;">Employee</div>
            </div>
        </div>
    </div>

    <!-- ДОБАВЕН: Current date display (в sidebar за запазване на дизайна) -->
    <div style="padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); font-size: 12px;">
        <span id="currentDate">Loading date...</span>
    </div>

    <div style="display:none;">
        <!-- вече добавените -->
        <select id="employeeSelect"><option value="">Dummy</option></select>
        <select id="activityInput"><option value="">Dummy</option></select>
        <input type="time" id="start-time">
        <input type="time" id="end-time">

        <!-- допълнителни dummy елементи -->
        <select id="leaveType"><option value="">None</option></select>
        <select id="hourlyRate"><option value="">0</option></select>
        <input type="hidden" id="edit-event-id" value="0">
        <input type="hidden" id="current-event-date" value="">
        <select id="edit-activity"><option value="">Dummy</option></select>
    </div>

    <!-- Logout - ПРОМЕНЕН ID за съвместимост -->
    <button id="logoutBtn" class="logout-btn" data-tooltip="Logout from Admin Profile">
        <span class="logout-icon">🏃‍♂️</span>
        <span class="button-text">Logout</span>
    </button>

    <!-- Weekly Hours -->
    <div id="weekly-schedule-section" class="weekly-schedule-section">
        <div class="weekly-schedule-header">
            <h3 id="weekly-schedule-title">📊 Weekly hours</h3>
            <button id="weekly-schedule-toggle" class="weekly-schedule-toggle-btn" title="Show/Hide Weekly Schedule">
                <span class="toggle-icon">📊</span>
                <span class="toggle-text">More Info</span>
            </button>
        </div>
        <div id="weekly-schedule-content" class="weekly-schedule-content hidden">
            <div id="weekly-schedule-table-container" class="weekly-schedule-table-container">
                <table id="weekly-schedule-table" class="weekly-schedule-table">
                    <thead>
                    <tr>
                        <th>C.W.</th>
                        <th>Working hours</th>
                        <th>Total hours</th>
                    </tr>
                    </thead>
                    <tbody id="weekly-schedule-tbody"></tbody>
                </table>
            </div>
            <div id="weekly-schedule-summary" class="weekly-schedule-summary"></div>
        </div>
    </div>
</div>

<!-- Calendar -->
<div id="calendar-container">
    <div id="calendar"></div>
</div>

<!-- Scripts -->
<script src="userDashboardManager.js" defer></script>

</body>
</html>
