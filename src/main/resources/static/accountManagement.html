<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management - Schedule Management System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/shopping.png">
    <link rel="stylesheet" href="loginStyle.css">
    <style>
        /* МОДАЛ СТИЛОВЕ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #dc3545;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .modal-header p {
            color: #6c757d;
            margin: 0;
        }

        /* СПИСЪК СЪС СЛУЖИТЕЛИ */
        .users-grid {
            display: grid;
            gap: 15px;
            margin-bottom: 25px;
        }

        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
            transition: all 0.2s ease;
        }

        .user-item:hover {
            border-color: #dc3545;
            background: #fff5f5;
        }

        .user-info h4 {
            margin: 0 0 5px 0;
            color: #333;
            font-size: 16px;
        }

        .user-info p {
            margin: 0;
            color: #6c757d;
            font-size: 14px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .delete-btn:active {
            transform: translateY(1px);
        }

        /* ТЪРСЕНЕ */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease;
            box-sizing: border-box;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
        }

        /* БУТОНИ ЗА МОДАЛА */
        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .close-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: #545b62;
        }

        /* ПРАЗНО СЪСТОЯНИЕ */
        .empty-state {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 40px 20px;
        }

        /* СЪОБЩЕНИЯ */
        .message {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .message.hidden {
            display: none;
        }

        /* LOADING СЪСТОЯНИЕ */
        .loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .modal-content {
                margin: 20px;
                width: calc(100% - 40px);
            }

            .user-item {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .modal-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<!-- ОСНОВЕН КОНТЕЙНЕР -->
<div class="login-container">
    <!-- HEADER С ЛОГО И ЗАГЛАВИЕ -->
    <div class="login-header">
        <div class="login-logo"><img src="images/shopping.png" alt="App Logo"></div>
        <h1>Account Management</h1>
        <p>Schedule Management System</p>
    </div>

    <!-- СЪОБЩЕНИЯ ЗА УСПЕХ/ГРЕШКА -->
    <div id="error-message" class="error-message" role="alert" style="display: none;">
        <span id="error-text"></span>
    </div>
    <div id="success-message" class="success-message" role="alert" style="display: none;">
        <span id="success-text"></span>
    </div>

    <!-- ТРИ БУТОНА В ЕДНА ЛИНИЯ -->
    <div class="form-actions">
        <div class="button-row">
            <button type="button" class="login-btn" id="addAccountBtn">
                ➕ Add account
            </button>
            <button type="button" class="login-btn" id="deleteAccountBtn">
                ❌ Delete account
            </button>
            <button type="button" class="login-btn" id="editAccountBtn">
                ✏️ Edit account
            </button>
        </div>
        <!-- НАЗАД КЪМ НАЧАЛНАТА СТРАНИЦА -->
        <div class="form-actions" style="margin-top: 30px;">
            <a href="index.html" class="link-btn">← Back to Account Management</a>
        </div>
    </div>
</div>

<!-- МОДАЛ ЗА ИЗТРИВАНЕ НА АКАУНТ -->
<div id="deleteAccountModal" class="modal-overlay">
    <div class="modal-content">
        <!-- HEADER НА МОДАЛА -->
        <div class="modal-header">
            <h2>❌ Delete Account</h2>
            <p>Select a user account to permanently delete</p>
        </div>

        <!-- СЪОБЩЕНИЯ -->
        <div id="modalMessage" class="message hidden"></div>

        <!-- ТЪРСЕНЕ -->
        <div class="search-container">
            <input type="text" id="userSearchInput" class="search-input"
                   placeholder="Search by name or username...">
        </div>

        <!-- СПИСЪК СЪС СЛУЖИТЕЛИ -->
        <div id="usersContainer">
            <!-- Тук ще се зареди списъкът със служители -->
            <div class="loading">Loading users...</div>
        </div>

        <!-- БУТОНИ ЗА МОДАЛА -->
        <div class="modal-actions">
            <button type="button" id="closeModalBtn" class="close-btn">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
    /**
     * ACCOUNT MANAGEMENT JAVASCRIPT
     * Управлява действията на трите основни бутона
     */

    // Глобални променливи за модала
    let allUsersForDelete = [];
    let filteredUsersForDelete = [];
    let currentLoggedUser = null;

    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 Account Management page loaded');

        // Проверяваме дали потребителят е логнат
        checkUserAuthentication();

        // Настройваме event listeners за бутоните
        setupButtonListeners();
    });

    /**
     * ПРОВЕРКА ЗА АВТЕНТИФИКАЦИЯ
     * Проверява дали потребителят е логнат преди да позволи достъп
     */
    function checkUserAuthentication() {
        const isLoggedIn = sessionStorage.getItem('isLoggedIn');
        const currentUser = sessionStorage.getItem('currentUser');

        console.log('🔍 Checking authentication - isLoggedIn:', isLoggedIn, 'currentUser exists:', !!currentUser);

        if (!isLoggedIn || isLoggedIn !== 'true' || !currentUser) {
            console.log('❌ User not authenticated, redirecting to login...');
            showError('You must be logged in to access account management.');

            sessionStorage.clear();

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
            return false;
        }
    }

    /**
     * НАСТРОЙКА НА EVENT LISTENERS ЗА БУТОНИТЕ
     */
    function setupButtonListeners() {
        console.log('🎧 Setting up button listeners...');

        // Add Account бутон
        document.getElementById("addAccountBtn").addEventListener("click", handleAddAccount);

        // Delete Account бутон
        document.getElementById("deleteAccountBtn").addEventListener("click", handleDeleteAccount);

        // Edit Account бутон
        document.getElementById("editAccountBtn").addEventListener("click", handleEditAccount);

        console.log('✅ Button listeners set up successfully');
    }

    /**
     * ОБРАБОТЧИК ЗА ADD ACCOUNT БУТОН
     * Пренасочва към регистрационната страница
     */
    function handleAddAccount() {
        console.log('➕ Add Account clicked');

        try {
            // Показваме loading съобщение
            showSuccess('Redirecting to registration page...');

            // Пренасочваме към регистрационната страница
            setTimeout(() => {
                window.location.href = '/registration.html';
            }, 500);

        } catch (error) {
            console.error('❌ Error redirecting to registration:', error);
            showError('Failed to redirect to registration page');
        }
    }

    /**
     * ОБРАБОТЧИК ЗА DELETE ACCOUNT БУТОН
     * Показва модала за изтриване на акаунт
     */
    function handleDeleteAccount() {
        console.log('❌ Delete Account clicked');

        try {
            // Показваме модала за изтриване
            showDeleteAccountModal();

        } catch (error) {
            console.error('❌ Error opening delete account modal:', error);
            showError('Failed to open delete account modal');
        }
    }

    /**
     * ОБРАБОТЧИК ЗА EDIT ACCOUNT БУТОН
     * Пренасочва към страницата за редактиране на акаунти
     */
    function handleEditAccount() {
        console.log('✏️ Edit Account clicked');

        try {
            // Показваме loading съобщение
            showSuccess('Loading edit account page...');

            // Пренасочваме към страницата за редактиране
            setTimeout(() => {
                window.location.href = '/editAccount.html';
            }, 500);

        } catch (error) {
            console.error('❌ Error redirecting to edit account:', error);
            showError('Failed to load edit account page');
        }
    }

    /**
     * ПОКАЗВА СЪОБЩЕНИЕ ЗА ГРЕШКА
     *
     * @param {string} message - съобщението за грешка
     */
    function showError(message) {
        const errorDiv = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');

        errorText.textContent = message;
        errorDiv.style.display = 'block';

        // Скриваме съобщението след 5 секунди
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 5000);

        console.error('❌ Error shown to user:', message);
    }

    /**
     * ПОКАЗВА СЪОБЩЕНИЕ ЗА УСПЕХ
     *
     * @param {string} message - съобщението за успех
     */
    function showSuccess(message) {
        const successDiv = document.getElementById('success-message');
        const successText = document.getElementById('success-text');

        successText.textContent = message;
        successDiv.style.display = 'block';

        // Скриваме съобщението след 3 секунди
        setTimeout(() => {
            successDiv.style.display = 'none';
        }, 3000);

        console.log('✅ Success shown to user:', message);
    }

    // ===================================
    // ФУНКЦИОНАЛНОСТ ЗА DELETE ACCOUNT MODAL
    // ===================================

    /**
     * ПОКАЗВА МОДАЛА ЗА ИЗТРИВАНЕ НА АКАУНТ
     */
    function showDeleteAccountModal() {
        console.log('🗑️ Opening delete account modal');

        const modal = document.getElementById('deleteAccountModal');
        modal.classList.add('show');

        // Зареждаме данните
        loadUsersForDelete();

        // Настройваме event listeners
        setupModalEventListeners();
    }

    /**
     * СКРИВА МОДАЛА ЗА ИЗТРИВАНЕ НА АКАУНТ
     */
    function hideDeleteAccountModal() {
        console.log('❌ Closing delete account modal');

        const modal = document.getElementById('deleteAccountModal');
        modal.classList.remove('show');

        // Изчистваме данните
        clearModalData();
    }

    /**
     * НАСТРОЙВА EVENT LISTENERS ЗА МОДАЛА
     */
    function setupModalEventListeners() {
        console.log('🎧 Setting up modal event listeners');

        // Close бутон
        const closeBtn = document.getElementById('closeModalBtn');
        closeBtn.removeEventListener('click', hideDeleteAccountModal); // Премахваме стария
        closeBtn.addEventListener('click', hideDeleteAccountModal);

        // Затваряне при клик извън модала
        const modal = document.getElementById('deleteAccountModal');
        modal.removeEventListener('click', handleModalOverlayClick);
        modal.addEventListener('click', handleModalOverlayClick);

        // Търсене
        const searchInput = document.getElementById('userSearchInput');
        searchInput.removeEventListener('input', handleUserSearch);
        searchInput.addEventListener('input', handleUserSearch);

        // ESC клавиш за затваряне
        document.removeEventListener('keydown', handleEscapeKey);
        document.addEventListener('keydown', handleEscapeKey);
    }

    /**
     * ОБРАБОТВА КЛИК ИЗВЪН МОДАЛА
     */
    function handleModalOverlayClick(event) {
        if (event.target === event.currentTarget) {
            hideDeleteAccountModal();
        }
    }

    /**
     * ОБРАБОТВА ESC КЛАВИША
     */
    function handleEscapeKey(event) {
        if (event.key === 'Escape') {
            hideDeleteAccountModal();
        }
    }

    /**
     * ЗАРЕЖДА ПОТРЕБИТЕЛИ ЗА ИЗТРИВАНЕ
     */
    async function loadUsersForDelete() {
        console.log('📥 Loading users for delete modal');

        showModalMessage('Loading users...', 'info');

        try {
            // Получаваме текущия логнат потребител
            currentLoggedUser = getCurrentLoggedUser();

            if (!currentLoggedUser) {
                throw new Error('No logged in user found');
            }

            console.log('👤 Current logged user:', currentLoggedUser);

            // Заявка към сървъра за всички потребители
            const response = await fetch('http://localhost:8080/api/auth/users');

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const users = await response.json();
            console.log('📊 Received users from server:', users);

            // Филтрираме потребителите (без текущия и админа)
            allUsersForDelete = users.filter(user => {
                // Изключваме текущия логнат потребител
                if (user.id === currentLoggedUser.id) {
                    return false;
                }

                // Изключваме админ потребители (ако имат роля admin)
                if (user.role && user.role.toLowerCase() === 'admin') {
                    return false;
                }

                // Изключваме потребители с username "admin" (fallback)
                if (user.username && user.username.toLowerCase() === 'admin') {
                    return false;
                }

                return true;
            });

            filteredUsersForDelete = [...allUsersForDelete];

            console.log(`✅ Filtered ${filteredUsersForDelete.length} users for deletion`);

            // Рендерираме списъка
            renderUsersForDelete();

            hideModalMessage();

        } catch (error) {
            console.error('❌ Error loading users for delete:', error);

            // Показваме по-детайлно съобщение за грешка
            if (error.message.includes('404')) {
                showModalMessage('Users endpoint not found. Please check if the server is running.', 'error');
            } else if (error.message.includes('Failed to fetch')) {
                showModalMessage('Cannot connect to server. Please check your connection.', 'error');
            } else {
                showModalMessage('Failed to load users. Please try again.', 'error');
            }
        }
    }

    /**
     * ПОЛУЧАВА ТЕКУЩИЯ ЛОГНАТ ПОТРЕБИТЕЛ
     */
    function getCurrentLoggedUser() {
        try {
            const currentUserData = sessionStorage.getItem('currentUser');
            if (!currentUserData) {
                console.warn('⚠️ No current user data in session');
                return null;
            }

            return JSON.parse(currentUserData);
        } catch (error) {
            console.error('❌ Error parsing current user data:', error);
            return null;
        }
    }

    /**
     * РЕНДЕРИРА СПИСЪКА СЪС СЛУЖИТЕЛИ ЗА ИЗТРИВАНЕ
     */
    function renderUsersForDelete() {
        console.log('🖼️ Rendering users for delete');

        const container = document.getElementById('usersContainer');

        if (filteredUsersForDelete.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    No employees available for deletion
                </div>
            `;
            return;
        }

        let html = '<div class="users-grid">';

        filteredUsersForDelete.forEach(user => {
            const displayName = user.employeeName || user.username || 'Unknown User';
            const username = user.username || 'N/A';
            const status = user.isActive ? 'Active' : 'Inactive';
            const statusColor = user.isActive ? '#28a745' : '#dc3545';

            html += `
                <div class="user-item" data-user-id="${user.id}">
                    <div class="user-info">
                        <h4>${displayName}</h4>
                        <p>@${username} • <span style="color: ${statusColor}">${status}</span></p>
                    </div>
                    <button type="button" class="delete-btn" onclick="confirmDeleteUser(${user.id}, '${displayName.replace(/'/g, "\\'")}')">
                        🗑️ Delete
                    </button>
                </div>
            `;
        });

        html += '</div>';
        container.innerHTML = html;

        console.log(`✅ Rendered ${filteredUsersForDelete.length} users for deletion`);
    }

    /**
     * ОБРАБОТВА ТЪРСЕНЕТО НА ПОТРЕБИТЕЛИ
     */
    function handleUserSearch(event) {
        const searchTerm = event.target.value.toLowerCase().trim();
        console.log('🔍 Searching users with term:', searchTerm);

        if (!searchTerm) {
            filteredUsersForDelete = [...allUsersForDelete];
        } else {
            filteredUsersForDelete = allUsersForDelete.filter(user => {
                const employeeName = (user.employeeName || '').toLowerCase();
                const username = (user.username || '').toLowerCase();

                return employeeName.includes(searchTerm) || username.includes(searchTerm);
            });
        }

        console.log(`🔍 Found ${filteredUsersForDelete.length} matching users`);
        renderUsersForDelete();
    }

    /**
     * ПОКАЗВА ПОТВЪРЖДЕНИЕ ЗА ИЗТРИВАНЕ
     */
    function confirmDeleteUser(userId, displayName) {
        console.log('⚠️ Confirming delete for user:', userId, displayName);

        const isConfirmed = confirm(
            `Are you sure you want to permanently delete the account of "${displayName}"?\n\n` +
            `This action cannot be undone and will remove all associated data.`
        );

        if (isConfirmed) {
            deleteUser(userId, displayName);
        } else {
            console.log('❌ User cancelled deletion');
        }
    }

    /**
     * ИЗТРИВА ПОТРЕБИТЕЛ
     */
    async function deleteUser(userId, displayName) {
        console.log('🗑️ Deleting user:', userId, displayName);

        showModalMessage(`Deleting ${displayName}...`, 'info');

        try {
            const response = await fetch(`http://localhost:8080/api/auth/users/${userId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                console.log('✅ User deleted successfully');
                showModalMessage(`✅ ${displayName} has been deleted successfully!`, 'success');

                // Премахваме потребителя от локалните списъци
                allUsersForDelete = allUsersForDelete.filter(user => user.id !== userId);
                filteredUsersForDelete = filteredUsersForDelete.filter(user => user.id !== userId);

                // Обновяваме списъка
                renderUsersForDelete();

                // Скриваме успешното съобщение след 3 секунди
                setTimeout(() => {
                    hideModalMessage();
                }, 3000);

            } else {
                const errorText = await response.text();
                throw new Error(`Server error: ${response.status} - ${errorText}`);
            }

        } catch (error) {
            console.error('❌ Error deleting user:', error);
            showModalMessage(`❌ Failed to delete ${displayName}. Please try again.`, 'error');
        }
    }

    /**
     * ПОКАЗВА СЪОБЩЕНИЕ В МОДАЛА
     */
    function showModalMessage(message, type = 'info') {
        const messageEl = document.getElementById('modalMessage');
        messageEl.textContent = message;
        messageEl.className = `message ${type}`;
        messageEl.classList.remove('hidden');
    }

    /**
     * СКРИВА СЪОБЩЕНИЕТО В МОДАЛА
     */
    function hideModalMessage() {
        const messageEl = document.getElementById('modalMessage');
        messageEl.classList.add('hidden');
    }

    /**
     * ИЗЧИСТВА ДАННИТЕ НА МОДАЛА
     */
    function clearModalData() {
        console.log('🧹 Clearing modal data');

        // Изчистваме търсенето
        document.getElementById('userSearchInput').value = '';

        // Изчистваме съобщенията
        hideModalMessage();

        // Изчистваме данните
        allUsersForDelete = [];
        filteredUsersForDelete = [];
        currentLoggedUser = null;

        // Премахваме event listeners
        document.removeEventListener('keydown', handleEscapeKey);
    }

    console.log('✅ Account Management script loaded');
</script>
</body>
</html>
