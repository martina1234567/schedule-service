<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Schedule Management System</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/shopping.png">
    <link rel="stylesheet" href="loginStyle.css">
</head>
<body>
<!-- ОСНОВЕН КОНТЕЙНЕР ЗА РЕГИСТРАЦИЯ -->
<div class="login-container">
    <!-- HEADER С ЛОГО И ЗАГЛАВИЕ -->
    <div class="login-header">
        <div class="login-logo"><img src="images/shopping.png" alt="App Logo"></div>
        <h1>Registration</h1>
        <p>Schedule Management System</p>
    </div>

    <!-- ERROR/SUCCESS СЪОБЩЕНИЯ -->
    <div id="error-message" class="error-message" role="alert" style="display: none;">
        <span id="error-text"></span>
    </div>

    <div id="success-message" class="success-message" role="alert" style="display: none;">
        <span id="success-text"></span>
    </div>

    <!-- ИЗБОР НА СЛУЖИТЕЛ -->
    <div class="form-group select-group">
        <label for="employeeSelect" class="form-label">Employee</label>
        <select id="employeeSelect" class="form-select" required>
            <option value="" disabled selected>Избери служител</option>
            <!-- Служителите се зареждат динамично чрез JavaScript -->
        </select>
        <div class="field-error" id="employeeSelect-error" style="display: none;"></div>
    </div>

    <!-- РЕГИСТРАЦИОННА ФОРМА -->
    <form class="login-form" id="registrationForm" novalidate>

        <!-- ПОЛЕ ЗА ПОТРЕБИТЕЛСКО ИМЕ -->
        <div class="form-group">
            <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder=" "
                    autocomplete="username"
                    required
                    minlength="7"
                    maxlength="50"
            >
            <label for="username" class="form-label">Username</label>
            <div class="field-error" id="username-error" style="display: none;"></div>
            <div class="field-help">
                Потребителското име трябва да съдържа поне 7 символа, поне една главна буква и поне един специален знак
            </div>
        </div>

        <!-- ПОЛЕ ЗА ПАРОЛА -->
        <div class="form-group">
            <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder=" "
                    autocomplete="new-password"
                    required
                    minlength="8"
                    maxlength="50"
            >
            <label for="password" class="form-label">Password</label>
            <button type="button" class="password-toggle" id="passwordToggle" title="Покажи/скрий парола">
                👁️
            </button>
            <div class="field-error" id="password-error" style="display: none;"></div>
        </div>

        <!-- ПОЛЕ ЗА ПОТВЪРЖДЕНИЕ НА ПАРОЛА -->
        <div class="form-group">
            <input
                    type="password"
                    id="confirmPassword"
                    class="form-input"
                    placeholder=" "
                    autocomplete="new-password"
                    required
                    minlength="8"
                    maxlength="50"
            >
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <button type="button" class="password-toggle" id="confirmPasswordToggle" title="Покажи/скрий парола">
                👁️
            </button>
            <div class="field-error" id="confirmPassword-error" style="display: none;"></div>
        </div>

        <!-- ИЗБОР НА РОЛЯ -->
        <div class="form-group select-group">
            <label for="roleSelect" class="form-label">Role</label>
            <select id="roleSelect" class="form-select" required>
                <option value="" disabled selected>Избери роля</option>
                <option value="user">User</option>
                <option value="admin">Administrator</option>
            </select>
            <div class="field-error" id="roleSelect-error" style="display: none;"></div>
        </div>

        <!-- БУТОНИ — непосредствено след избора на роля -->
        <div class="form-actions">
            <div class="button-row">
                <button type="submit" class="login-btn" id="registerBtn">
                    <span class="btn-text">Add account</span>
                    <span class="btn-loading" style="display: none;">Създаване...</span>
                </button>

                <button type="button" class="login-btn" id="cancelBtn" title="Отказ и връщане назад">
                    <span>❌ Cancel ❌</span>
                </button>
            </div>
        </div>
    </form>
</div>

<!-- JAVASCRIPT ЗА РЕГИСТРАЦИЯТА -->
<script src="registrationManager.js" defer></script>

</body>
</html>
