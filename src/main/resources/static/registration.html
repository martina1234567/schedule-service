<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Schedule Management System</title>
    <link rel="stylesheet" href="loginStyle.css">
</head>
<body>
<!-- ОСНОВЕН КОНТЕЙНЕР ЗА ЛОГИН -->
<div class="login-container">
    <!-- HEADER С ЛОГО И ЗАГЛАВИЕ -->
    <div class="login-header">

        <div class="login-logo"><img src="images/shopping.png" alt="App Logo"></div>
        <h1>Registration</h1>
        <p>Schedule Management System</p>
    </div>

    <!-- ERROR СЪОБЩЕНИЯ -->
    <div id="error-message" class="error-message" role="alert">
        <span id="error-text"></span>
    </div>

    <div class="form-group select-group">
        <!-- СТАТИЧЕН LABEL - винаги в горния ляв ъгъл -->
        <label for="employeeSelect" class="form-label">Employee</label>

        <!-- SELECT ЕЛЕМЕНТ -->
        <select id="employeeSelect" class="form-select" required>
            <option value="" disabled selected>Избери служител</option>
        </select>
    </div>


    <!-- ЛОГИН ФОРМА -->
    <form class="login-form" id="loginForm" novalidate>
        <!-- ПОЛЕ ЗА ПОТРЕБИТЕЛСКО ИМЕ/EMAIL -->
        <div class="form-group">
            <input
                    type="text"
                    id="username"
                    class="form-input"
                    placeholder=" "
                    autocomplete="username"
                    required
            >
            <label for="username" class="form-label">Username</label>
        </div>

        <!-- ПОЛЕ ЗА ПАРОЛА -->
        <div class="form-group">
            <input
                    type="password"
                    id="password"
                    class="form-input"
                    placeholder=" "
                    autocomplete="current-password"
                    required
            >
            <label for="password" class="form-label">Password</label>
            <button type="button" class="password-toggle" id="passwordToggle" title="Покажи/скрий парола">
                👁️
            </button>
        </div>

        <!-- ИЗБОР НА РОЛЯ -->
        <div class="role-selector">
            <div class="role-option">
                <input type="radio" id="roleUser" name="role" value="user" class="role-radio" checked>
                <label for="roleUser" class="role-label">👤 Потребител</label>
            </div>
            <div class="role-option">
                <input type="radio" id="roleAdmin" name="role" value="admin" class="role-radio">
                <label for="roleAdmin" class="role-label">👑 Администратор</label>
            </div>
        </div>

        <!-- CHECKBOX ЗА "ЗАПОМНИ МЕ" -->
        <div class="remember-me">
            <input type="checkbox" id="rememberMe" name="rememberMe">
            <label for="rememberMe">Remember me</label>
        </div>

        <!-- БУТОН ЗА ВЛИЗАНЕ -->
        <button type="submit" class="login-btn" id="loginBtn">
            Add account
        </button>
    </form>

    <!-- FOOTER -->
    <div class="login-footer">
        <p>&copy; 2025 <span class="twingo-brand">Twingo</span>. All rights reserved.</p>
    </div>
</div>

<script src="registrationManager.js" defer></script>
</body>
</html>
